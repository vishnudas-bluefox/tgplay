[project]
name = "tgplay"
version = "0.1.0"
description = "Monitor Telegram downloads on macOS and play them before they finish"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Vishnudas-bluefox", email = "vishnudas@users.noreply.github.com" }]
keywords = ["telegram", "macos", "cli", "video", "vlc", "mpv", "iina"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Video",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tgplay = "tgplay.cli:main"

[project.urls]
Homepage = "https://github.com/vishnudas-bluefox/tgplay"
Repository = "https://github.com/vishnudas-bluefox/tgplay"
Issues = "https://github.com/vishnudas-bluefox/tgplay/issues"
Changelog = "https://github.com/vishnudas-bluefox/tgplay/blob/main/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tgplay"]

[tool.pytest.ini_options]
testpaths = ["tests"]
